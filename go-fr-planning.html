<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>GOPRO</title>
<noscript><meta http-equiv="refresh" content="0;url=https://www.youtube.com/watch?v=IqgsCB4m-7k"></noscript></head>
<body style="font-family:Arial,sans-serif"><p>Ouverture de la vid&eacute;o / Opening the video&hellip; <a href="https://www.youtube.com/watch?v=IqgsCB4m-7k">OK</a></p>
<script src="go-config.js"></script>
<script>
(function () {
  var DEST = "https://www.youtube.com/watch?v=IqgsCB4m-7k", API = window.GOPRO_API || "", F = "planning", L = "fr", done = false;
  function go() { if (done) return; done = true; location.replace(DEST); }
  var c = new URLSearchParams(location.search).get("c") || "";
  if (!c || /[{}]/.test(c)) c = "(inconnu)";
  var body = JSON.stringify({ f: F, c: c, l: L }), sent = false;
  if (!API) { go(); return; }
  try { if (navigator.sendBeacon) sent = navigator.sendBeacon(API, body); } catch (e) {}
  if (sent) { setTimeout(go, 300); return; }
  try {
    fetch(API, { method: "POST", mode: "no-cors", keepalive: true,
                 headers: { "Content-Type": "text/plain" }, body: body }).then(go, go);
  } catch (e) { go(); }
  setTimeout(go, 2500);
})();
</script></body></html>
