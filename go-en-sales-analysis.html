<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>GOPRO</title>
<noscript><meta http-equiv="refresh" content="0;url=https://www.youtube.com/watch?v=JLjl9gCRTwk&feature=sales-analysis"></noscript></head>
<body style="font-family:Arial,sans-serif"><p>Ouverture de la vid&eacute;o / Opening the video&hellip; <a href="https://www.youtube.com/watch?v=JLjl9gCRTwk&feature=sales-analysis">OK</a></p>
<script src="go-config.js"></script>
<script>
(function () {
  var DEST = "https://www.youtube.com/watch?v=JLjl9gCRTwk&feature=sales-analysis", API = window.GOPRO_API || "", F = "sales-analysis", L = "en", done = false;
  function go() { if (done) return; done = true; location.replace(DEST); }
  var c = new URLSearchParams(location.search).get("c") || "";
  if (!c || /[{}]/.test(c)) c = "(inconnu)";
  try {
    if (!API) { go(); return; }
    fetch(API + "?f=" + encodeURIComponent(F) + "&c=" + encodeURIComponent(c) + "&l=" + L,
          { mode: "no-cors", keepalive: true, cache: "no-store" }).then(go, go);
  } catch (e) { go(); }
  setTimeout(go, 2500);
})();
</script></body></html>
